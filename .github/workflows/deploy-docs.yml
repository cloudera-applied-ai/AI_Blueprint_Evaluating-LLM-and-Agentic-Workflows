name: deploy-docs

# Publishes MkDocs to GitHub Pages. One-time: Settings → Pages → Source → GitHub Actions.

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

# Least-privilege token: read the repo, write the Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one Pages deployment at a time; never cancel an in-flight publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docs.txt

      - name: Build site
        run: mkdocs build --clean

      - name: Require GitHub Pages (one-time admin setup)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh api "repos/${GITHUB_REPOSITORY}/pages" --silent 2>/dev/null; then
            echo "::error::GitHub Pages is not enabled for this repository."
            echo "Enable it once: Settings → Pages → Build and deployment → Source → GitHub Actions"
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
